[project]
name = "formelx"
version = "0.1.0"
description = "Chemistry learning web app: periodic table, compounds and questions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "bcrypt>=4.2.1",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.7.1",
    # Only used by the one-time Supabase import (src/backend/import_supabase.py).
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "aiosqlite>=0.20.0",
    "pytest-playwright>=0.6.2",
]

[tool.uv]
# This is an application, not a library: install the dependencies, not the project itself.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["e2e: browser tests with Playwright (need `uv run playwright install chromium`)"]
