# FormelX with its own PostgreSQL database.
#
#   docker compose up -d --build        # start (applies migrations automatically)
#   docker compose up -d db             # only the database, for local development
#
# Settings come from .env (see .env.example). POSTGRES_PASSWORD must be set there.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: formelx
      POSTGRES_USER: formelx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Reachable from this machine only (for local development and backups).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formelx -d formelx"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://formelx:${POSTGRES_PASSWORD}@db:5432/formelx
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/elements')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  db-data:
