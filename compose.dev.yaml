# Local development only: publishes the database (and optionally the app) on localhost.
# Never use this file on the server.
#
#   docker network create web                                   # once; compose.yaml expects it
#   docker compose -f compose.yaml -f compose.dev.yaml up -d db # Postgres on 127.0.0.1:5432
#   uv run uvicorn src.backend.main:app --reload                # app from source, see .env
#
# Or the whole stack in Docker on http://127.0.0.1:8000:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build

services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  app:
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      # Plain http://localhost: browsers drop Secure cookies there.
      SECURE_COOKIES: "false"
